# https://crontab.cronhub.io/
# https://sqatools.in/github-actions-fundamentals-for-beginners/
# .github/workflows/greeting.yml
name: Daily Greeting
on:
  schedule:
    - cron: '*/5 * * * *' # Runs every 5 minutes

jobs:
  greet1:
    runs-on: ubuntu-latest
    steps:
      - run: echo "Good morning, team!"

  greet2:
    runs-on: ubuntu-latest
    steps:
      - run: echo "Good noon, team!"

  greet3:
    runs-on: ubuntu-latest
    steps:
      - run: echo "Good evening, team!"